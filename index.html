<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>图册 · 去过的地方</title>
<meta name="description" content="一个地标一本相册。照片原样，只做编排。" />
<meta name="theme-color" content="#F4F2EC" />
<meta property="og:title" content="图册 · 去过的地方" />
<meta property="og:description" content="一个地标就是一本相册。" />
<meta property="og:type" content="website" />
<link rel="preload" href="assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin />
<script>
try {
  var t = localStorage.getItem('atlas.theme');
  if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
</script>
<link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>

<a class="skip" href="#wall">跳到相册</a>

<header class="bar">
  <a class="mark" href="#" aria-label="回到顶部">
    <span class="mark__en" id="site-name">ATLAS</span>
    <span class="mark__cn" id="site-cn">图册</span>
  </a>

  <nav class="views" role="tablist" id="views" aria-label="视图">
    <button type="button" role="tab" data-view="wall" aria-selected="true">相册</button>
    <button type="button" role="tab" data-view="index" aria-selected="false">索引</button>
    <button type="button" role="tab" data-view="atlas" aria-selected="false">地图</button>
  </nav>

  <div class="bar__end">
    <span class="bar__stat"><span id="stat-landmarks">0</span> 地标 · <span id="stat-photos">0</span> 张</span>

    <div class="menu" id="menu">
      <button type="button" class="btn-icon" id="btn-menu" aria-haspopup="true" aria-expanded="false" aria-label="更多">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="5.5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
          <circle cx="18.5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <div class="menu__pop" id="menu-pop" role="menu" hidden>
        <button type="button" role="menuitem" data-act="new">新建地标</button>
        <button type="button" role="menuitem" data-act="settings">站点设置</button>
        <button type="button" role="menuitem" data-act="theme">明暗主题</button>
        <span class="menu__sep"></span>
        <button type="button" role="menuitem" data-act="export">导出作品集</button>
      </div>
    </div>
  </div>
</header>

<main>

  <!-- ══════════ 开篇 ══════════ -->
  <section class="intro" id="intro">
    <h1 class="intro__title" id="site-title">去过的地方</h1>
    <p class="intro__lede" id="site-lede"></p>
    <p class="intro__meta"><span id="intro-count">0 个地标</span></p>
  </section>

  <!-- ══════════ 相册墙 ══════════ -->
  <section class="view is-on" id="wall" aria-label="相册">
    <div class="wall" id="wall-grid"></div>
    <div class="wall__foot">
      <button type="button" class="btn btn--line" id="btn-new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="square"/></svg>
        新建地标
      </button>
      <p class="wall__hint">地标与照片都存在这台机器上 · 不上传服务器</p>
    </div>
  </section>

  <!-- ══════════ 索引 ══════════ -->
  <section class="view" id="index" aria-label="索引" hidden>
    <div class="idx__head">
      <span>#</span><span>地标</span><span>坐标</span><span>时间</span><span>张数</span><span></span>
    </div>
    <div class="idx" id="idx-list"></div>
  </section>

  <!-- ══════════ 地图 ══════════ -->
  <section class="view" id="atlas" aria-label="地图" hidden>
    <div class="map" id="map">
      <svg class="map__grid" id="map-grid" aria-hidden="true"></svg>
      <div class="map__pins" id="map-pins"></div>
    </div>
    <p class="map__legend">按经纬度摆位 · 点的大小是那本相册的张数</p>
  </section>

</main>

<footer class="colophon" id="colophon">
  <div class="colophon__grid">
    <p class="colophon__body" id="site-colophon">
      每个地标是一本相册。照片保持原样，只做编排。
    </p>
    <dl class="colophon__list">
      <div><dt>字体</dt><dd>Archivo Variable · 系统黑体</dd></div>
      <div><dt>收存</dt><dd id="colophon-stat">0 个地标 · 0 张照片</dd></div>
    </dl>
    <div class="colophon__tail">
      <p class="colophon__sig" id="site-sig">ATLAS</p>
      <a class="colophon__mail" href="mailto:hello@example.com">hello@example.com</a>
    </div>
  </div>
</footer>

<!-- ══════════ 相册 ══════════ -->
<section class="album" id="album" aria-hidden="true" aria-labelledby="album-name">
  <div class="album__bar">
    <button type="button" class="album__back" id="album-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M14 5l-7 7 7 7" stroke-linecap="square"/></svg>
      相册
    </button>
    <p class="album__crumb" id="album-crumb">—</p>
    <button type="button" class="album__del" id="album-delete">删这一本</button>
  </div>

  <div class="album__scroll" id="album-scroll">
    <header class="album__head">
      <div>
        <h2 class="album__name" id="album-name">—</h2>
        <p class="album__meta" id="album-meta"></p>
      </div>
      <p class="album__note" id="album-note"></p>
    </header>

    <figure class="lead" id="lead">
      <img id="lead-img" alt="" />
      <figcaption class="lead__cap">
        <span id="lead-no">—</span>
        <span id="lead-name">—</span>
        <span id="lead-dim">—</span>
      </figcaption>
      <p class="exif" id="exif"></p>
    </figure>

    <div class="strip" id="strip"></div>

    <label class="add" id="add-photo" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
        <path d="M12 8v8M8 12h8" stroke-linecap="square"/><rect x="2.5" y="2.5" width="19" height="19"/>
      </svg>
      <span class="add__label">添加照片</span>
      <span class="add__hint">可一次选多张 · 拖进来也行 · 原图保存，不做任何处理</span>
      <input type="file" id="file" accept="image/*" multiple />
    </label>

    <p class="note" id="note" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- ══════════ 大图 ══════════ -->
<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-label="查看照片">
  <div class="lb__bar">
    <span class="lb__no" id="lb-no">—</span>
    <span class="lb__name" id="lb-name">—</span>
    <div class="lb__nav">
      <button type="button" class="lb__btn" id="lb-prev" aria-label="上一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M14 5l-7 7 7 7" stroke-linecap="square"/></svg>
      </button>
      <button type="button" class="lb__btn" id="lb-next" aria-label="下一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M10 5l7 7-7 7" stroke-linecap="square"/></svg>
      </button>
      <button type="button" class="lb__btn" id="lb-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="square"/></svg>
      </button>
    </div>
  </div>
  <div class="lb__stage" id="lb-stage">
    <img id="lb-img" alt="" />
  </div>
  <div class="lb__foot">
    <span class="lb__exif" id="lb-exif"></span>
    <span class="lb__hint">← → 翻页 · Esc 关闭</span>
  </div>
</div>

<!-- ══════════ 新建地标 ══════════ -->
<dialog class="dlg" id="dlg" aria-labelledby="dlg-title">
  <form method="dialog" class="dlg__form" id="dlg-form">
    <h2 class="dlg__title" id="dlg-title">新建地标</h2>
    <p class="dlg__sub">它会成为一本相册。</p>

    <label class="field">
      <span class="field__name">地名</span>
      <input class="field__input" id="f-name" type="text" maxlength="16" placeholder="里斯本" required autocomplete="off" />
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field__name">坐标<span class="field__opt">选填</span></span>
        <input class="field__input" id="f-coord" type="text" maxlength="26" placeholder="38.72°N 9.14°W" autocomplete="off" />
      </label>
      <label class="field">
        <span class="field__name">时间<span class="field__opt">选填</span></span>
        <input class="field__input" id="f-date" type="text" maxlength="20" placeholder="2025 年 4 月" autocomplete="off" />
      </label>
    </div>

    <label class="field">
      <span class="field__name">一句话<span class="field__opt">选填</span></span>
      <input class="field__input" id="f-note" type="text" maxlength="64" placeholder="七丘之城的赭与青。" autocomplete="off" />
    </label>

    <div class="field">
      <span class="field__name">颜色</span>
      <div class="swatches" id="swatches-new" role="group" aria-label="地标颜色"></div>
    </div>

    <div class="dlg__actions">
      <button type="button" class="btn btn--line" id="dlg-cancel">取消</button>
      <button type="submit" class="btn btn--solid">建这一本</button>
    </div>
  </form>
</dialog>

<!-- ══════════ 站点设置 ══════════ -->
<dialog class="dlg" id="dlg-site" aria-labelledby="dlg-site-title">
  <form method="dialog" class="dlg__form" id="site-form">
    <h2 class="dlg__title" id="dlg-site-title">站点设置</h2>
    <p class="dlg__sub">只改你这台机器上的样子。</p>

    <div class="field-row">
      <label class="field">
        <span class="field__name">名字</span>
        <input class="field__input" id="s-name" type="text" maxlength="18" placeholder="ATLAS" autocomplete="off" />
      </label>
      <label class="field">
        <span class="field__name">副标<span class="field__opt">选填</span></span>
        <input class="field__input" id="s-cn" type="text" maxlength="10" placeholder="图册" autocomplete="off" />
      </label>
    </div>

    <label class="field">
      <span class="field__name">开篇标题</span>
      <input class="field__input" id="s-title" type="text" maxlength="24" placeholder="去过的地方" autocomplete="off" />
    </label>

    <label class="field">
      <span class="field__name">开篇一句话<span class="field__opt">选填</span></span>
      <textarea class="field__input field__input--area" id="s-lede" rows="3" maxlength="180"></textarea>
    </label>

    <div class="dlg__actions">
      <button type="button" class="btn btn--line" id="site-cancel">取消</button>
      <button type="submit" class="btn btn--solid">保存</button>
    </div>
  </form>
</dialog>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
