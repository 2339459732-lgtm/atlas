<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS · 星空对照</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #05060a; height: 100%; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; left: 18px; bottom: 16px; z-index: 3;
    font: 10px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .12em; color: rgba(210, 220, 240, .55);
    text-transform: uppercase; pointer-events: none;
  }
  .hud b { color: rgba(235, 242, 255, .9); font-weight: 500; letter-spacing: .06em; }
  .hud .row { display: flex; gap: 10px; }
  .hud .k { width: 96px; color: rgba(160, 175, 200, .55); }
  .badge {
    position: fixed; left: 18px; top: 16px; z-index: 3;
    font: 9px/1 ui-monospace, Menlo, monospace; letter-spacing: .22em;
    color: rgba(150, 165, 190, .5); text-transform: uppercase;
  }
  .badge strong { display: block; margin-bottom: 6px; font-size: 11px; letter-spacing: .1em; color: rgba(235, 242, 255, .82); font-weight: 500; }
  button {
    position: fixed; right: 18px; top: 16px; z-index: 4;
    height: 28px; padding: 0 12px; background: transparent;
    border: 1px solid rgba(255,255,255,.16); border-radius: 2px; color: rgba(230,240,255,.7);
    font: 9px/1 ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; cursor: pointer;
  }
  button:hover { border-color: rgba(255,255,255,.4); color: #fff; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="badge"><strong>ATLAS · SKY FIELD</strong>2 : 1 对照画幅 · 与站内共用同一张星表</div>
<button id="toggle">隐藏参数</button>
<div class="hud" id="hud"></div>

<script type="module">
import {
  VS_QUAD, FS_SKY, VS_STAR, FS_STAR,
  LAYOUT, LANES, METEOR_SPEC,
  frame as skyFrame, catalog as skyCatalog
} from './assets/js/skyfield.js';

const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false });

function sh(type, src, tag) {
  const o = gl.createShader(type);
  gl.shaderSource(o, src); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) {
    console.error(tag, gl.getShaderInfoLog(o));
    return null;
  }
  return o;
}
function prog(vs, fs, tag) {
  const p = gl.createProgram();
  const a = sh(gl.VERTEX_SHADER, vs, tag + ':vs');
  const b = sh(gl.FRAGMENT_SHADER, fs, tag + ':fs');
  if (!a || !b) return null;
  gl.attachShader(p, a); gl.attachShader(p, b);
  gl.bindAttribLocation(p, 0, 'aP');
  gl.bindAttribLocation(p, 1, 'aDir');
  gl.bindAttribLocation(p, 2, 'aPack');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(tag, gl.getProgramInfoLog(p));
    return null;
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const inf = gl.getActiveUniform(p, i);
    u[inf.name] = gl.getUniformLocation(p, inf.name);
  }
  return { p, u };
}

const pSky = prog(VS_QUAD, FS_SKY, 'sky');
const pStar = prog(VS_STAR, FS_STAR, 'star');

/* ── 画幅：2:1，垂直视野 46°，与参考图接近 ── */
const FOV = 46 * Math.PI / 180;
const tanHalf = Math.tan(FOV / 2);

const L = skyFrame({
  yaw: 0.30, pitch: 0.40,
  bandY: LAYOUT.bandY, coreX: LAYOUT.coreX,
  aspect: 2.0, tanHalf
});

/* 让银道亮脊落在画面正中：相机正对银道最近点 */
const fwd = L.pole.slice();
const n0 = L.core;                                   /* 银心方向（在银道面内） */
const nearPt = (() => {                              /* 银道面内离原视轴最近的方向 */
  const v = L.fwd;
  const d = v[0] * L.pole[0] + v[1] * L.pole[1] + v[2] * L.pole[2];
  const r = [v[0] - L.pole[0] * d, v[1] - L.pole[1] * d, v[2] - L.pole[2] * d];
  const n = Math.hypot(...r) || 1;
  return r.map(x => x / n);
})();

/* 相机：fwd 指向银道面上银心与近点的中点，银道即水平穿过画面中部 */
const cameraFwd = (() => {
  const c = L.core;
  const v = [0, 1, 2].map(i => c[i] * 0.72 + nearPt[i] * 0.28);
  const n = Math.hypot(...v) || 1;
  return v.map(x => x / n);
})();
const right = (() => {
  const v = [
    cameraFwd[1] * L.pole[2] - cameraFwd[2] * L.pole[1],
    cameraFwd[2] * L.pole[0] - cameraFwd[0] * L.pole[2],
    cameraFwd[0] * L.pole[1] - cameraFwd[1] * L.pole[0]
  ];
  const n = Math.hypot(...v) || 1;
  return v.map(x => x / n);
})();
const up = [
  right[1] * cameraFwd[2] - right[2] * cameraFwd[1],
  right[2] * cameraFwd[0] - right[0] * cameraFwd[2],
  right[0] * cameraFwd[1] - right[1] * cameraFwd[0]
];

/* ── 投影矩阵（透视，不用 lookAt，直接给基向量） ── */
function perspective(aspect) {
  const f = 1 / Math.tan(FOV / 2);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, -1.0002, -1,
    0, 0, -0.2, 0
  ]);
}
function viewFrom(right, up, fwd) {
  return new Float32Array([
    right[0], up[0], -fwd[0], 0,
    right[1], up[1], -fwd[1], 0,
    right[2], up[2], -fwd[2], 0,
    0, 0, 0, 1
  ]);
}

/* ── 星表：与站内同一颗种子，因此逐点一致 ── */
const count = 190000;
const cat = skyCatalog({ count, pole: L.pole, core: L.core, e1: L.e1, e2: L.e2 });

const dirBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, dirBuf);
gl.bufferData(gl.ARRAY_BUFFER, cat.dir, gl.STATIC_DRAW);
const packBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, packBuf);
gl.bufferData(gl.ARRAY_BUFFER, cat.pack, gl.STATIC_DRAW);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

const laneV = new Float32Array(24);
const laneW = new Float32Array(12);
LANES.forEach((l, i) => {
  laneV[i * 4] = l.b0; laneV[i * 4 + 1] = l.amp; laneV[i * 4 + 2] = l.k; laneV[i * 4 + 3] = l.ph;
  laneW[i * 2] = l.w; laneW[i * 2 + 1] = l.d;
});

let W = 1, H = 1, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
}
addEventListener('resize', resize);
resize();

function draw() {
  const aspect = W / H;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);

  gl.useProgram(pSky.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform3fv(pSky.u.uRight, right);
  gl.uniform3fv(pSky.u.uUp, up);
  gl.uniform3fv(pSky.u.uFwd, cameraFwd);
  gl.uniform1f(pSky.u.uTanHalf, tanHalf);
  gl.uniform1f(pSky.u.uAspect, aspect);
  gl.uniform3fv(pSky.u.uPole, L.pole);
  gl.uniform3fv(pSky.u.uCore, L.core);
  gl.uniform3fv(pSky.u.uE1, L.e1);
  gl.uniform3fv(pSky.u.uE2, L.e2);
  gl.uniform3fv(pSky.u.uCool, [0.44, 0.54, 0.76]);
  gl.uniform3fv(pSky.u.uWarm, [1.0, 0.86, 0.66]);
  gl.uniform3fv(pSky.u.uTop, [0.045, 0.048, 0.062]);
  gl.uniform3fv(pSky.u.uBottom, [0.012, 0.012, 0.018]);
  gl.uniform1f(pSky.u.uGlow, 1.0);
  gl.uniform1f(pSky.u.uGrain, 0.012);
  gl.uniform4fv(pSky.u['uLane[0]'], laneV);
  gl.uniform2fv(pSky.u['uLaneW[0]'], laneW);
  gl.uniform1f(pSky.u.uLaneN, LANES.length);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(pStar.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, dirBuf);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, packBuf);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 0, 0);
  gl.uniformMatrix4fv(pStar.u.uProj, false, perspective(aspect));
  gl.uniformMatrix4fv(pStar.u.uView, false, viewFrom(right, up, cameraFwd));
  gl.uniform1f(pStar.u.uDpr, dpr);
  gl.uniform1f(pStar.u.uTime, performance.now() * 0.001);
  gl.uniform1f(pStar.u.uStars, 1);
  gl.drawArrays(gl.POINTS, 0, cat.count);
}

function loop() { draw(); requestAnimationFrame(loop); }
loop();

/* ── 参数面板：逐项可对照 ── */
const rows = [
  ['星点数', cat.count.toLocaleString() + ' 颗（种子 20261112，可复现）'],
  ['视野', '46° 垂直 / 2:1 画幅'],
  ['银道位置', '水平，过画面中部'],
  ['亮脊半宽', LAYOUT.width.toFixed(3) + ' rad ≈ 3.6°'],
  ['银心', '画面中点偏右，与参考一致'],
  ['暗带', LANES.length + ' 条，参数化波浪线（非噪声）'],
  ['星等分级', '0.2% 亮星带星芒 / 3.8% / 20% / 其余暗星'],
  ['色温', '蓝白 → 正白 → 暖白 → 橙，六档'],
  ['流星', METEOR_SPEC.particles + ' 粒子/颗，二次贝塞尔轨迹，' + METEOR_SPEC.life + 's'],
  ['噪声', '0（无 fbm、无云状暗尘）']
];
document.getElementById('hud').innerHTML = rows
  .map(([k, v]) => `<div class="row"><span class="k">${k}</span><span>${v}</span></div>`)
  .join('');

const btn = document.getElementById('toggle');
btn.addEventListener('click', () => {
  const hud = document.getElementById('hud');
  const off = hud.style.display === 'none';
  hud.style.display = off ? '' : 'none';
  btn.textContent = off ? '隐藏参数' : '显示参数';
});
</script>
</body>
</html>
